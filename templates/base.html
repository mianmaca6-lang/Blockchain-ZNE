<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Colmena Financiera{% endblock %}</title>
    <!-- Aquí vinculamos el CSS compilado de Tailwind -->
    <link href="{{ url_for('static', path='/css/output.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    
    <nav class="bg-blue-900 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">🐝 Colmena Financiera</h1>
            <div>
                <a href="/" class="hover:text-blue-300 px-3">Dashboard</a>
                <a href="/reglas" class="hover:text-blue-300 px-3">Memoria del Sistema</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 mt-4">
        <!-- El contenido de las otras páginas se inyecta aquí -->
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
